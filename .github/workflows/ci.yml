name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Generate OpenAPI spec
        run: |
          python scripts/generate_openapi.py
          git diff --exit-code openapi.json || (echo "openapi.json is out of date; run 'python scripts/generate_openapi.py' and commit the result." && exit 1)

      - name: Lint with ruff
        run: |
          python -m pip install --upgrade ruff
          ruff check .
